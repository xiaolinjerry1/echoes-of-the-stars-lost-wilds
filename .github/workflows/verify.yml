name: Godot v1 production regression
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runtime sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            core
            scenes
            data
            art/models
            art/textures
            art/previews/player
            audio
            dev
      - name: Install official Godot 4.6 stable
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64
      - name: Fresh import
        run: /tmp/godot/Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Run production regression
        run: /tmp/godot/Godot_v4.6-stable_linux.x86_64 --headless --path . res://dev/verify_boot.tscn
